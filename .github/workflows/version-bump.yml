name: Version Bump

# Cuts a release without writing a Conventional Commit: pick the bump, and this
# runs `npm version`, pushes the commit and tag, and stages the result on npm.
# Useful for a release that the commit history does not describe on its own.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to increase'
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: 'Stage nothing on npm; only rehearse the release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  bump:
    name: Bump the version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.bump.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump, commit and tag
        id: bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag="$(npm version "${{ inputs.bump }}" -m 'chore(release): %s')"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "Bumped to $tag"
          git push origin main --follow-tags

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag_name }}" \
            --title "${{ steps.bump.outputs.tag_name }}" \
            --generate-notes \
            --verify-tag

  stage:
    name: Stage the release
    needs: bump
    # As with release-please, the tag pushed above cannot trigger release.yml, so
    # it is called directly. npm's trusted publisher must name this file for this
    # path, because npm authorizes the workflow that starts the run.
    uses: ./.github/workflows/release.yml
    with:
      dry_run: ${{ inputs.dry_run }}
      # The bump happened inside this run, so the commit that started it still
      # carries the old version. Release the tag that was just created.
      ref: ${{ needs.bump.outputs.tag_name }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit
