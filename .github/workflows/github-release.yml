name: GitHub Release

# Creates the GitHub Release for a tag pushed by a person. release-please and
# version-bump.yml create their own releases, so this only covers the manual
# path. It lives outside release.yml because a reusable workflow cannot request
# more permission than its caller grants, and `contents: write` here would force
# every caller of release.yml to hand over write access it does not need.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  github-release:
    name: Create the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it untouched."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
