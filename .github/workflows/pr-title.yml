name: PR Title

# Pull requests are squash-merged, so the PR title is the commit message that
# lands on main and the only thing release-please reads. A title that does not
# parse is silently left out of every future release, which is why this is a
# required check rather than a note in the template.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Validate the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|a11y|docs|build|chore|ci|refactor|test|style|revert)(\([a-z0-9._-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "OK: $TITLE"
            exit 0
          fi

          echo "::error title=PR title is not a Conventional Commit::$TITLE"
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## The PR title needs a Conventional Commits type

          It becomes the squashed commit message on `main`, and release-please
          reads it to decide the next version. Without a type, this change is
          left out of every future release.

          ```
          feat: add a styled <progress> element     minor
          fix: raise the contrast of muted text     patch
          feat!: drop the legacy [switch] attribute breaking
          docs: chore: ci: refactor: test:          no release
          ```

          A scope is optional and lowercase: `fix(forms): ...`.
          Editing the title re-runs this check — no new commit needed.
          SUMMARY
          exit 1
