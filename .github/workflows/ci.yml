name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never writes back to git, so don't leave the checkout
          # token behind in .git/config for later steps to reach.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint:ts

      - name: Lint CSS
        run: npm run lint:css

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify the npm package contents
        run: npm pack --dry-run

      - name: Audit dependencies (non-blocking)
        run: npm audit --omit=dev || true
