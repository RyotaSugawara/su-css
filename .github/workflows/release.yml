name: Release

on:
  # A tag pushed by a person. Tags created by release-please or version-bump.yml
  # carry the GITHUB_TOKEN identity and deliberately do not trigger workflows, so
  # those two call this workflow directly instead (see workflow_call below).
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and `npm stage publish --dry-run` without staging anything'
        type: boolean
        default: true
  workflow_call:
    inputs:
      dry_run:
        description: 'Stage nothing; run the checks and `npm stage publish --dry-run`'
        type: boolean
        default: false
      ref:
        description: 'Commit, tag or branch to release. Defaults to the commit that started the run, which is wrong for a caller that creates the version commit itself.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Stage to npm
    runs-on: ubuntu-latest
    # Optional hardening: add `environment: npm` here to gate releases behind an
    # environment (required reviewers, scoped secrets). If you do, the npm trusted
    # publisher config must carry the same environment name. Environments in private
    # repositories require GitHub Pro/Team/Enterprise, so it is left off by default.
    permissions:
      contents: read
      # Required to mint the OIDC token used by npm trusted publishing (and by
      # `npm publish --provenance` for its Sigstore signing certificate).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty means "the commit that started the run", which is what a tag
          # push and a workflow_dispatch both want.
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          # Required even though it is the default: it makes setup-node write the
          # .npmrc that both the OIDC exchange and NODE_AUTH_TOKEN rely on.
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # `npm stage publish` needs npm >= 11.15.0 and trusted publishing needs
        # Node >= 22.14.0; the npm bundled with Node 22 is older than that. Pinned
        # to the 11.x line so the step does not silently depend on whatever
        # npm@latest requires next.
        run: |
          npm install -g npm@^11.15.0
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg."
            exit 1
          fi
          echo "Releasing v$pkg"

      - name: Verify the version is not already released
        # `npm stage publish` rejects a duplicate version server-side, even with
        # --dry-run, but only after building and uploading the tarball. Fail here
        # instead, with a message that says to bump the version.
        run: npm run check:unpublished

      - name: Type check
        run: npm run lint:ts

      - name: Lint CSS
        run: npm run lint:css

      - name: Test
        run: npm run test

      - name: Build package artifacts
        run: npm run build:lib

      - name: Stage the release
        # `npm stage publish` uploads the tarball to npm's staging queue instead of
        # releasing it. A maintainer then approves it with a 2FA challenge, so a
        # compromised workflow cannot reach consumers on its own. `prepack` rebuilds
        # dist-lib/, so the staged tarball always matches src/lib/sucss.css.
        #
        # Authentication is picked automatically:
        #   - no NPM_TOKEN secret  -> trusted publishing (OIDC), the preferred path.
        #   - NPM_TOKEN secret set -> classic token auth, the bootstrap path used
        #     before a trusted publisher could be configured on npmjs.com.
        #
        # Provenance is only accepted for public repositories, so it is enabled
        # automatically once this repository becomes public and skipped while it is private.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          args=(--access public)
          if [ "${{ github.event.repository.visibility }}" = "public" ]; then
            args+=(--provenance)
          else
            echo "::notice::Repository is ${{ github.event.repository.visibility }}; staging without provenance."
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi

          if [ -n "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is set; staging with token auth."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "::notice::No NPM_TOKEN; staging with trusted publishing (OIDC)."
          fi

          echo "npm stage publish ${args[*]}"
          npm stage publish "${args[@]}"

      - name: Explain how to approve
        if: success() && inputs.dry_run != true
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "## Staged, not yet released"
            echo
            echo "\`@ryo9ra/su-css@${version}\` is waiting in npm's staging queue."
            echo "It is **not installable** until a maintainer approves it with 2FA."
            echo
            echo "- Approve on the web: <https://www.npmjs.com/package/@ryo9ra/su-css>"
            echo "- Or from a terminal:"
            echo
            echo '```bash'
            echo "npm stage list @ryo9ra/su-css"
            echo "npm stage approve <stage-id>   # prompts for 2FA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
